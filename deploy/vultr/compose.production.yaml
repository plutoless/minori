services:
  app:
    image: ${MINORI_IMAGE:?MINORI_IMAGE is required}
    container_name: minori
    env_file:
      - ${MINORI_ENV_FILE:?MINORI_ENV_FILE is required}
    environment:
      PORT: "3000"
      LARK_CLI_BIN: /app/node_modules/.bin/lark-cli
    ports:
      - "127.0.0.1:${MINORI_HEALTH_PORT:-3000}:3000"
    volumes:
      - /opt/minori/lark:/var/lib/minori/lark
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
