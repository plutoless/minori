name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  verify:
    uses: ./.github/workflows/quality-gate.yml
    with:
      gate: verify
    permissions:
      contents: read

  integration:
    uses: ./.github/workflows/quality-gate.yml
    with:
      gate: integration
    permissions:
      contents: read

  image-amd64:
    uses: ./.github/workflows/quality-gate.yml
    with:
      gate: image-amd64
    permissions:
      contents: read

  validate:
    needs: [verify, integration, image-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.release.outputs.commitSha }}
      version: ${{ steps.release.outputs.version }}
      semver_tag: ${{ steps.release.outputs.semverTag }}
      ghcr_image: ${{ steps.release.outputs.ghcrImage }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Fetch main ancestry
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Validate release
        id: release
        env:
          GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
        run: node --experimental-strip-types scripts/validate-release.ts

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          labels: org.opencontainers.image.revision=${{ needs.validate.outputs.commit_sha }}
          tags: |
            ${{ needs.validate.outputs.ghcr_image }}:${{ needs.validate.outputs.commit_sha }}
            ${{ needs.validate.outputs.ghcr_image }}:${{ needs.validate.outputs.version }}
      - name: Summarize published artifact
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.semver_tag }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### Release artifact\n'
            printf -- "- Tag: \`%s\`\n" "$RELEASE_TAG"
            printf -- "- SHA: \`%s\`\n" "$COMMIT_SHA"
            printf -- "- Digest: \`%s\`\n" "$BUILD_DIGEST"
            printf -- "- Result: \`image_published\`\n"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: production
      cancel-in-progress: false
      queue: max
    steps:
      - name: Prepare SSH material
        env:
          DEPLOY_KEY: ${{ secrets.VULTR_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VULTR_KNOWN_HOSTS }}
        run: |
          [[ -n "$DEPLOY_KEY" && -n "$KNOWN_HOSTS" ]]
          umask 077
          trap 'rm -f -- "${SSH_KEY_FILE:-}" "${SSH_KNOWN_HOSTS_FILE:-}" "${SSH_STDOUT_FILE:-}" "${SSH_STDERR_FILE:-}"' ERR
          SSH_KEY_FILE="$(mktemp "$RUNNER_TEMP/minori-deploy-key.XXXXXX")"
          printf 'SSH_KEY_FILE=%s\n' "$SSH_KEY_FILE" >> "$GITHUB_ENV"
          printf '%s\n' "$DEPLOY_KEY" > "$SSH_KEY_FILE"
          chmod 0600 "$SSH_KEY_FILE"
          SSH_KNOWN_HOSTS_FILE="$(mktemp "$RUNNER_TEMP/minori-known-hosts.XXXXXX")"
          printf 'SSH_KNOWN_HOSTS_FILE=%s\n' "$SSH_KNOWN_HOSTS_FILE" >> "$GITHUB_ENV"
          printf '%s\n' "$KNOWN_HOSTS" > "$SSH_KNOWN_HOSTS_FILE"
          chmod 0600 "$SSH_KNOWN_HOSTS_FILE"
          SSH_STDOUT_FILE="$(mktemp "$RUNNER_TEMP/minori-ssh-stdout.XXXXXX")"
          printf 'SSH_STDOUT_FILE=%s\n' "$SSH_STDOUT_FILE" >> "$GITHUB_ENV"
          SSH_STDERR_FILE="$(mktemp "$RUNNER_TEMP/minori-ssh-stderr.XXXXXX")"
          printf 'SSH_STDERR_FILE=%s\n' "$SSH_STDERR_FILE" >> "$GITHUB_ENV"
          trap - ERR
      - name: Deploy immutable digest
        env:
          BUILD_DIGEST: ${{ needs.publish.outputs.digest }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.semver_tag }}
          GHCR_IMAGE: ${{ needs.validate.outputs.ghcr_image }}
          DEPLOY_HOST: ${{ vars.VULTR_HOST }}
          DEPLOY_USER: ${{ vars.VULTR_USER }}
        run: |
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GHCR_IMAGE" == 'ghcr.io/plutoless/minori' ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" == 'root' ]]
          deploy_target="root@${DEPLOY_HOST}"
          remote_command="deploy v1 ${COMMIT_SHA} ${GHCR_IMAGE}@${BUILD_DIGEST}"

          set +e
          ssh \
            -i "$SSH_KEY_FILE" \
            -F /dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE" \
            -o GlobalKnownHostsFile=/dev/null \
            -- "$deploy_target" "$remote_command" \
            >"$SSH_STDOUT_FILE" 2>"$SSH_STDERR_FILE"
          ssh_status=$?
          set -e

          deploy_output="$(<"$SSH_STDOUT_FILE")"
          active_sha='none'
          active_image='none'
          success_pattern='^minori_deploy result=success active_sha=([0-9a-f]{40}) active_image=(ghcr\.io/plutoless/minori@sha256:[0-9a-f]{64})$'
          rollback_pattern='^minori_deploy result=rolled_back active_sha=([0-9a-f]{40}) active_image=(ghcr\.io/plutoless/minori@sha256:[0-9a-f]{64}|minori:[0-9a-f]{40})$'
          failed_before_pattern='^minori_deploy result=failed_before_replace active_sha=([0-9a-f]{40}) active_image=(ghcr\.io/plutoless/minori@sha256:[0-9a-f]{64}|minori:[0-9a-f]{40})$'
          if [[ "$deploy_output" =~ $success_pattern ]]; then
            result_category='success'
            active_sha="${BASH_REMATCH[1]}"
            active_image="${BASH_REMATCH[2]}"
            if [[ "$active_sha" != "$COMMIT_SHA" || "$active_image" != "${GHCR_IMAGE}@${BUILD_DIGEST}" ]]; then
              result_category='deployment_protocol_error'
              active_sha='none'
              active_image='none'
            fi
          elif [[ "$deploy_output" =~ $rollback_pattern ]]; then
            result_category='rolled_back'
            active_sha="${BASH_REMATCH[1]}"
            active_image="${BASH_REMATCH[2]}"
            if [[ "$active_image" == minori:* && "${active_image#minori:}" != "$active_sha" ]]; then
              result_category='deployment_protocol_error'
              active_sha='none'
              active_image='none'
            fi
          elif [[ "$deploy_output" =~ $failed_before_pattern ]]; then
            result_category='failed_before_replace'
            active_sha="${BASH_REMATCH[1]}"
            active_image="${BASH_REMATCH[2]}"
            if [[ "$active_image" == minori:* && "${active_image#minori:}" != "$active_sha" ]]; then
              result_category='deployment_protocol_error'
              active_sha='none'
              active_image='none'
            fi
          else
          case "$deploy_output" in
            'minori_deploy result=rejected') result_category='rejected' ;;
            'minori_deploy result=failed') result_category='failed' ;;
            'minori_deploy result=locked') result_category='locked' ;;
            'minori_deploy result=rollback_failed') result_category='rollback_failed' ;;
            'minori_deploy result=recovery_failed') result_category='recovery_failed' ;;
            *) result_category='deployment_protocol_error' ;;
          esac
          fi
          case "${ssh_status}:${result_category}" in
            0:success|1:rolled_back|1:failed|1:failed_before_replace|1:rollback_failed|1:recovery_failed|2:rejected|75:locked) ;;
            255:*) result_category='deployment_transport_failed'; active_sha='none'; active_image='none' ;;
            *) result_category='deployment_protocol_error'; active_sha='none'; active_image='none' ;;
          esac
          {
            printf '### Production deployment\n'
            printf -- "- Tag: \`%s\`\n" "$RELEASE_TAG"
            printf -- "- Attempted SHA: \`%s\`\n" "$COMMIT_SHA"
            printf -- "- Attempted digest: \`%s\`\n" "$BUILD_DIGEST"
            printf -- "- Result: \`%s\`\n" "$result_category"
            printf -- "- Active SHA: \`%s\`\n" "$active_sha"
            printf -- "- Active image: \`%s\`\n" "$active_image"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$ssh_status" -ne 0 || "$result_category" != 'success' ]]; then
            printf 'production_deployment_failed category=%s\n' "$result_category" >&2
            exit 1
          fi
      - name: Remove SSH material
        if: always()
        run: |
          rm -f -- "$SSH_KEY_FILE" "$SSH_KNOWN_HOSTS_FILE"
          rm -f -- "$SSH_STDOUT_FILE" "$SSH_STDERR_FILE"
